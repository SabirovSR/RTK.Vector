name: CI and production
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vector
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vector_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vector -d vector_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - name: Production configuration boundaries
        run: python scripts/check-production-config.py
      - name: Migrations and PostgreSQL integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://vector:ci-only-password@localhost:5432/vector_test
          TEST_DATABASE_URL: postgresql+psycopg://vector:ci-only-password@localhost:5432/vector_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          python -m pytest -q
      - name: Frontend and generated API types
        run: |
          npm ci --prefix frontend
          (cd backend && python -m app.export_openapi)
          npm run api:types --prefix frontend
          git diff --exit-code -- backend/openapi.json frontend/src/generated-api.d.ts
          npm run build --prefix frontend
      - name: Full browser journey
        run: |
          docker compose up -d --build --wait --wait-timeout 180
          docker compose exec -T backend python -m app.cli seed
          cd frontend
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt
      - run: npm ci --prefix frontend && npm audit --prefix frontend --audit-level=high

  release:
    needs: [checks, security]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.images.outputs.backend }}
      frontend: ${{ steps.images.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and publish immutable images
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build --push --label org.opencontainers.image.source=https://github.com/SabirovSR/RTK.Vector --label org.opencontainers.image.revision="$GITHUB_SHA" --metadata-file backend-meta.json -t "ghcr.io/sabirovsr/rtk-vector-backend:$GITHUB_SHA" backend
          docker buildx build --push --label org.opencontainers.image.source=https://github.com/SabirovSR/RTK.Vector --label org.opencontainers.image.revision="$GITHUB_SHA" --metadata-file frontend-meta.json -t "ghcr.io/sabirovsr/rtk-vector-frontend:$GITHUB_SHA" frontend
          echo "backend=$(jq -r '.["containerimage.digest"]' backend-meta.json)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(jq -r '.["containerimage.digest"]' frontend-meta.json)" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io

  deploy:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://vector.sabirov.tech
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      packages: read
      contents: read
    steps:
      - name: Skip superseded release
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api repos/SabirovSR/RTK.Vector/git/ref/heads/main --jq .object.sha)
          if [ "$head" = "$GITHUB_SHA" ]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; fi
      - name: Deploy with restricted SSH key
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ github.token }}
          BACKEND_DIGEST: ${{ needs.release.outputs.backend }}
          FRONTEND_DIGEST: ${{ needs.release.outputs.frontend }}
        run: |
          umask 077
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" vector-deploy@139.100.233.90 "deploy $GITHUB_SHA $BACKEND_DIGEST $FRONTEND_DIGEST"
          curl --fail --retry 5 --retry-delay 5 https://vector.sabirov.tech/api/v1/health
