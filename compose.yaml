services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vector
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vector-local-dev}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector"]
      interval: 3s
      retries: 20
  backend:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://vector:${POSTGRES_PASSWORD:-vector-local-dev}@db:5432/vector
      STORAGE_PATH: /storage
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEBSITE_API_KEY: ${WEBSITE_API_KEY:-local-demo-key-change-before-use}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-VectorDemo2026!}
    volumes: ["documents:/storage", "./data:/data:ro"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      retries: 20
  worker:
    build: ./backend
    command: python -m app.worker
    environment: *backend-env
    volumes: ["documents:/storage"]
    depends_on:
      backend: {condition: service_healthy}
      mailpit: {condition: service_started}
  frontend:
    build:
      context: ./frontend
      args:
        VITE_SHOW_DEMO_CREDENTIALS: "true"
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      backend: {condition: service_healthy}
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
volumes:
  postgres_data:
  documents:
